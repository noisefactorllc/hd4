<!DOCTYPE html>
<html lang="en" data-theme="neutral-dark" data-language="industrial">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>HD4 — Four-Channel Video Mixer</title>
    <meta name="description" content="A four-channel software video mixer for the open web. Broadcast-style switcher with an integrated audio mixer, built on Noisemaker and WebAudio.">
    <meta name="author" content="Noise Factor">

    <link rel="preconnect" href="https://fonts.noisefactor.io" crossorigin>
    <link rel="preconnect" href="https://shaders.noisedeck.app" crossorigin>
    <link rel="preconnect" href="https://handfish.noisefactor.io" crossorigin>

    <!-- Global typeface: Atkinson Hyperlegible (Braille Institute high-legibility
         face), supplied by handfish's industrial design language layer
         (data-language="industrial"). The metric-matched Blank placeholder
         preloads and reserves exact space so the real face swaps in with zero
         layout shift / no flash of fallback text. -->
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Blank.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- handfish design language: tokens, base components, utilities. -->
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/index.css">
    <!-- handfish "neutral dark" theme (colors only; activated via data-theme). -->
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/themes/neutral.css">
    <!-- Industrial typeface language (Atkinson + .hf-logotype + .hf-topbar
         chrome); orthogonal to the colour theme, opted in at <html>. -->
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/industrial.css">

    <!-- Resolve `import ... from 'handfish'` to the CDN bundle (custom elements). -->
    <script type="importmap">
        { "imports": { "handfish": "https://handfish.noisefactor.io/0/handfish.esm.min.js" } }
    </script>

    <link rel="stylesheet" href="css/hd4.css">
</head>
<body>
    <!-- Structural mount points. The UI modules populate these; the
         layout regions mirror a hardware mixer panel: program on top, source
         bus alongside, transition + effects, audio mixer at the base. -->
    <!-- VFX filter defs (referenced by the program compositor's canvas filter). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <filter id="hd4-vfx-posterize" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                    <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
                    <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
                    <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
                </feComponentTransfer>
            </filter>
            <filter id="hd4-vfx-emboss" color-interpolation-filters="sRGB">
                <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
                    kernelMatrix="-2 -1 0  -1 1 1  0 1 2"/>
            </filter>
            <filter id="hd4-vfx-edge" color-interpolation-filters="sRGB">
                <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
                    kernelMatrix="-1 -1 -1  -1 8 -1  -1 -1 -1"/>
            </filter>
        </defs>
    </svg>

    <div id="app">
        <header id="hd4-topbar" class="hd4-topbar"></header>
        <main id="hd4-stage" class="hd4-stage">
            <section id="hd4-program" class="hd4-program"></section>
            <section id="hd4-sources" class="hd4-sources"></section>
        </main>
        <section id="hd4-compositor" class="hd4-compositor"></section>
        <section id="hd4-transition" class="hd4-transition"></section>
        <section id="hd4-mixer" class="hd4-mixer"></section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
