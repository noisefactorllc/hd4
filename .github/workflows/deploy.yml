name: Deploy

# Scaffold is the sole authority for hd4 deploys. This workflow just
# fires the workflow_dispatch at scaffold's static-site-release, which
# clones this repo at the pushed SHA, stages a clean tree
# (index.html + css/ + js/ + img/), writes deployment-meta.json, and
# publishes it to hd4.noisefactor.io.
#
# This repo carries no deploy secrets — only the EHSRE app private key,
# which is scoped to dispatching scaffold workflows. It is a repo-level
# secret: the org-level copy reaches private repos only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - '.github/workflows/deploy.yml'

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Mint scaffold GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch scaffold static-site-release for hd4
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f site=hd4 \
            -f sha=${{ github.sha }}
          echo "Dispatched scaffold static-site-release for hd4 @ ${{ github.sha }}"
